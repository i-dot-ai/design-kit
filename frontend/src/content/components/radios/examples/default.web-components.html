<iai-form-group>
  <iai-fieldset>
    <iai-fieldset-legend>Have you changed your name?</iai-fieldset-legend>
    <iai-radios>
      <iai-radio-item>
        <iai-radio-input id="changed-name" name="changed-name" value="yes"></iai-radio-input>
        <iai-radio-label for="changed-name">Yes</iai-radio-label>
      </iai-radio-item>
      <iai-radio-item>
        <iai-radio-input id="changed-name-2" name="changed-name" value="no"></iai-radio-input>
        <iai-radio-label for="changed-name-2">No</iai-radio-label>
      </iai-radio-item>
    </iai-radios>
  </iai-fieldset>
</iai-form-group>
