<div class="iai-chart iai-chart--doughnut" data-module="iai-chart">
    <h3 class="govuk-heading-m">Application outcomes</h3>
    <details class="govuk-details">
        <summary class="govuk-details__summary">
            <span class="govuk-details__summary-text">Show data<span class="govuk-visually-hidden"> for Application outcomes</span></span>
        </summary>
        <div class="govuk-details__text">
            <table class="govuk-table">
                <caption class="govuk-table__caption govuk-table__caption--s">Application outcomes</caption>
                <thead class="govuk-table__head">
                    <tr class="govuk-table__row">
                        <th scope="col" class="govuk-table__header">Outcome</th>
                        <th scope="col" class="govuk-table__header govuk-table__header--numeric">Applications</th>
                    </tr>
                </thead>
                <tbody class="govuk-table__body">
                    <tr class="govuk-table__row">
                        <th scope="row" class="govuk-table__header">Approved</th>
                        <td class="govuk-table__cell govuk-table__cell--numeric">5,400</td>
                    </tr>
                    <tr class="govuk-table__row">
                        <th scope="row" class="govuk-table__header">Refused</th>
                        <td class="govuk-table__cell govuk-table__cell--numeric">1,900</td>
                    </tr>
                    <tr class="govuk-table__row">
                        <th scope="row" class="govuk-table__header">Pending</th>
                        <td class="govuk-table__cell govuk-table__cell--numeric">1,500</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </details>
</div>
