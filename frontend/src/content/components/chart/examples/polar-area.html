<div class="iai-chart iai-chart--polar-area" data-module="iai-chart">
    <h3 class="govuk-heading-m">Average processing time by application type</h3>
    <details class="govuk-details">
        <summary class="govuk-details__summary">
            <span class="govuk-details__summary-text">Show data</span>
        </summary>
        <div class="govuk-details__text">
            <table class="govuk-table">
                <caption class="govuk-table__caption govuk-table__caption--s">Average processing time by application type</caption>
                <thead class="govuk-table__head">
                    <tr class="govuk-table__row">
                        <th scope="col" class="govuk-table__header">Application type</th>
                        <th scope="col" class="govuk-table__header govuk-table__header--numeric">Days</th>
                    </tr>
                </thead>
                <tbody class="govuk-table__body">
                    <tr class="govuk-table__row">
                        <th scope="row" class="govuk-table__header" data-iai-chart-colour="blue-shade-50">New</th>
                        <td class="govuk-table__cell govuk-table__cell--numeric">12</td>
                    </tr>
                    <tr class="govuk-table__row">
                        <th scope="row" class="govuk-table__header" data-iai-chart-colour="blue">Renewal</th>
                        <td class="govuk-table__cell govuk-table__cell--numeric">5</td>
                    </tr>
                    <tr class="govuk-table__row">
                        <th scope="row" class="govuk-table__header" data-iai-chart-colour="teal-tint-25">Change of details</th>
                        <td class="govuk-table__cell govuk-table__cell--numeric">3</td>
                    </tr>
                    <tr class="govuk-table__row">
                        <th scope="row" class="govuk-table__header" data-iai-chart-colour="magenta">Appeal</th>
                        <td class="govuk-table__cell govuk-table__cell--numeric">28</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </details>
</div>
