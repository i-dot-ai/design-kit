<iai-form-group>
  <iai-fieldset>
    <iai-fieldset-legend>What is your nationality?</iai-fieldset-legend>
    <iai-checkboxes subtle>
      <iai-checkbox-item>
        <iai-checkbox-input id="nationality-subtle" name="nationality-subtle" value="british"></iai-checkbox-input>
        <iai-checkbox-label for="nationality-subtle">British</iai-checkbox-label>
      </iai-checkbox-item>
      <iai-checkbox-item>
        <iai-checkbox-input id="nationality-subtle-2" name="nationality-subtle" value="irish"></iai-checkbox-input>
        <iai-checkbox-label for="nationality-subtle-2">Irish</iai-checkbox-label>
      </iai-checkbox-item>
      <iai-checkbox-item>
        <iai-checkbox-input id="nationality-subtle-3" name="nationality-subtle" value="other"></iai-checkbox-input>
        <iai-checkbox-label for="nationality-subtle-3">Citizen of another country</iai-checkbox-label>
      </iai-checkbox-item>
    </iai-checkboxes>
  </iai-fieldset>
</iai-form-group>
