<iai-form-group>
  <iai-fieldset>
    <iai-fieldset-legend>What is your nationality?</iai-fieldset-legend>
    <iai-checkboxes>
      <iai-checkbox-item>
        <iai-checkbox-input id="nationality" name="nationality" value="british"></iai-checkbox-input>
        <iai-checkbox-label for="nationality">British</iai-checkbox-label>
      </iai-checkbox-item>
      <iai-checkbox-item>
        <iai-checkbox-input id="nationality-2" name="nationality" value="irish"></iai-checkbox-input>
        <iai-checkbox-label for="nationality-2">Irish</iai-checkbox-label>
      </iai-checkbox-item>
      <iai-checkbox-item>
        <iai-checkbox-input id="nationality-3" name="nationality" value="other"></iai-checkbox-input>
        <iai-checkbox-label for="nationality-3">Citizen of another country</iai-checkbox-label>
      </iai-checkbox-item>
    </iai-checkboxes>
  </iai-fieldset>
</iai-form-group>
