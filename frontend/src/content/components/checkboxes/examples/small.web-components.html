<iai-form-group>
  <iai-fieldset>
    <iai-fieldset-legend>What is your nationality?</iai-fieldset-legend>
    <iai-checkboxes small>
      <iai-checkbox-item>
        <iai-checkbox-input id="nationality-small" name="nationality-small" value="british"></iai-checkbox-input>
        <iai-checkbox-label for="nationality-small">British</iai-checkbox-label>
      </iai-checkbox-item>
      <iai-checkbox-item>
        <iai-checkbox-input id="nationality-small-2" name="nationality-small" value="irish"></iai-checkbox-input>
        <iai-checkbox-label for="nationality-small-2">Irish</iai-checkbox-label>
      </iai-checkbox-item>
      <iai-checkbox-item>
        <iai-checkbox-input id="nationality-small-3" name="nationality-small" value="other"></iai-checkbox-input>
        <iai-checkbox-label for="nationality-small-3">Citizen of another country</iai-checkbox-label>
      </iai-checkbox-item>
    </iai-checkboxes>
  </iai-fieldset>
</iai-form-group>
