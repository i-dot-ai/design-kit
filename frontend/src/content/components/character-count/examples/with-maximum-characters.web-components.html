<iai-form-group
  class="govuk-character-count"
  data-module="govuk-character-count"
  data-maxlength="10"
>
  <iai-input-label for="more-detail">Can you provide more detail?</iai-input-label>
  <iai-character-count
    id="more-detail"
    name="more-detail"
    rows="5"
    aria-describedby="more-detail-info"
  ></iai-character-count>
  <iai-character-count-message id="more-detail-info">
    You can enter up to 10 characters
  </iai-character-count-message>
</iai-form-group>
