<iai-form-group>
  <iai-fieldset role="group" aria-describedby="dob-hint">
    <iai-fieldset-legend>What is your date of birth?</iai-fieldset-legend>
    <iai-hint id="dob-hint">For example, 31 3 1980</iai-hint>
    <iai-date-input id="dob">
      <iai-date-input-item>
        <iai-form-group>
          <iai-input-label class="govuk-date-input__label" for="dob-day">Day</iai-input-label>
          <iai-date-input-field id="dob-day" name="day" width="2"></iai-date-input-field>
        </iai-form-group>
      </iai-date-input-item>
      <iai-date-input-item>
        <iai-form-group>
          <iai-input-label class="govuk-date-input__label" for="dob-month">Month</iai-input-label>
          <iai-date-input-field id="dob-month" name="month" width="2"></iai-date-input-field>
        </iai-form-group>
      </iai-date-input-item>
      <iai-date-input-item>
        <iai-form-group>
          <iai-input-label class="govuk-date-input__label" for="dob-year">Year</iai-input-label>
          <iai-date-input-field id="dob-year" name="year" width="4"></iai-date-input-field>
        </iai-form-group>
      </iai-date-input-item>
    </iai-date-input>
  </iai-fieldset>
</iai-form-group>
